    <!-- Outer Ring -->
    <circle cx="30" cy="34" r="23" fill="none" stroke="#f5a623" stroke-width="6.5"/>
    <!-- Stylized Lowercase 'e' Mark -->
    <path d="M 17 34 H 43 A 13 13 0 1 0 30 47" fill="none" stroke="#f5a623" stroke-width="5.5" stroke-linecap="round"/>
  </g>

